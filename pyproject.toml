[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multiple-temporal-lenses"
version = "0.1.0"
description = "Experiments on query-gated heterogeneous temporal state"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "torch>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
